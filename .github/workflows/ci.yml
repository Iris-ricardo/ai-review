name: CI

# 每次推送到 main、以及每个 PR 都跑一遍全量测试。
# 后端在 windows-latest 上跑：本项目的解析/报告链路依赖 Windows 字体与 PowerShell 脚本，
# 在 Windows 上跑才和真实部署环境一致（LibreOffice 缺失时相关用例自行跳过）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend-tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # GitHub 的 Windows Server 镜像默认不含中日韩字体，而报告生成必须先注册一个
      # TrueType 中文字体（backend/app/services/report/reporter.py: register_chinese_font）。
      # 缺字体时 registry 会抛 RuntimeError，整个审查任务失败——本地有微软雅黑所以看不出来，
      # 这里显式装一个开源字体（文泉驿微米黑，TrueType 轮廓，reportlab 可用）并指给 REPORT_FONT_PATH。
      - name: 安装中文字体（runner 镜像默认没有）
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'cjk-font'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $font = Join-Path $dir 'wqy-microhei.ttc'
          $urls = @(
            'https://cdn.jsdelivr.net/gh/anthonyfok/fonts-wqy-microhei@master/wqy-microhei.ttc',
            'https://raw.githubusercontent.com/anthonyfok/fonts-wqy-microhei/master/wqy-microhei.ttc'
          )
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile $font -TimeoutSec 120
              if ((Test-Path $font) -and (Get-Item $font).Length -gt 1MB) { Write-Host "downloaded: $u"; break }
            } catch { Write-Host "failed: $u -> $($_.Exception.Message)" }
          }
          if (-not (Test-Path $font) -or (Get-Item $font).Length -lt 1MB) { throw '中文字体下载失败，报告链路无法测试' }
          "REPORT_FONT_PATH=$font" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $env:REPORT_FONT_PATH = $font
          python -c "from app.services.report.reporter import register_chinese_font; print('CJK font registered as:', register_chinese_font())"

      # DOCX 审查链路是 DOCX → LibreOffice → PDFParser（services/parser/docx_parser.py 顶部说明），
      # runner 镜像不带 LibreOffice，缺了它所有 DOCX 端到端用例都会失败（表现为 500 与 KeyError）。
      - name: 安装 LibreOffice（DOCX 审查必需）
        shell: pwsh
        run: |
          choco install libreoffice-fresh -y --no-progress --limit-output
          $soffice = 'C:\Program Files\LibreOffice\program\soffice.exe'
          if (-not (Test-Path $soffice)) { throw "LibreOffice 安装后仍未找到 $soffice" }
          "SOFFICE_PATH=$soffice" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & $soffice --version

      - name: 运行 pytest（pytest.ini 已固定 basetemp 与 testpaths）
        shell: pwsh
        run: |
          python -m pytest -q 2>&1 | Tee-Object -FilePath pytest.log
          $code = $LASTEXITCODE
          $summary = (Get-Content pytest.log | Select-String -Pattern 'passed|failed|error' | Select-Object -Last 1).Line
          if ($summary) { Write-Host "::notice::pytest 结果：$($summary.Trim())" }
          exit $code

      # 失败时把失败用例名提成注解（GitHub 会在仓库页面直接显示），
      # 并写进 Job Summary，避免只能翻几千行原始日志。
      - name: 汇总失败用例
        if: failure()
        shell: pwsh
        run: |
          $fails = @()
          if (Test-Path pytest.log) {
            # 每条 check run 能展示的注解数量有限（约 10 条），所以只提前 8 条，
            # 完整列表写进 Job Summary。
            $fails = Get-Content pytest.log | Select-String -Pattern '^(FAILED|ERROR) ' | Select-Object -First 8
          }
          foreach ($f in $fails) { Write-Host "::error::$($f.Line)" }
          if ($fails.Count -eq 0) { Write-Host "::error::pytest 失败，但日志里没有 FAILED/ERROR 行（可能是收集中断或超时）" }
          "### 后端测试失败用例" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          foreach ($f in $fails) { "- ``$($f.Line)``" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }

  frontend:
    name: frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 单元测试（vitest）
        run: npm test

      - name: 接口层测试（node --test）
        run: npm run test:node

      - name: 生产构建自检
        run: npm run build
